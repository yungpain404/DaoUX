<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dạo — Demo tương tác Web &amp; App</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f8f7;--card:#fff;--ink:#0f2a2e;--mu:#5c7276;--ln:#dce6e4;--mint:#e3f2f0;--p:#0e7c7b;--pd:#0a5c5c;--cta:#0a5c5c;--gr:#1e8e5a;--grb:#ddf3e8;--am:#9a4a07;--amb:#fde9c8;--st:#f59e0b;--off:#e9efee;--rd:#c0392b;--rdb:#fde2e0;--stage:#e4ebea;--sh:rgba(15,41,46,.1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1415;--card:#14211f;--ink:#e8f1ef;--mu:#9fb4b3;--ln:#27403c;--mint:#16302d;--pd:#6fd6d1;--gr:#5fd49a;--grb:#17372b;--am:#f4b46a;--amb:#3b2a12;--off:#1d2e2c;--rd:#f19a92;--rdb:#3a1d1b;--stage:#070d0e;--sh:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1415;--card:#14211f;--ink:#e8f1ef;--mu:#9fb4b3;--ln:#27403c;--mint:#16302d;--pd:#6fd6d1;--gr:#5fd49a;--grb:#17372b;--am:#f4b46a;--amb:#3b2a12;--off:#1d2e2c;--rd:#f19a92;--rdb:#3a1d1b;--stage:#070d0e;--sh:rgba(0,0,0,.4);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--stage);color:var(--ink);font-size:14px;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
svg{flex:none}
#bar{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--ln);flex-wrap:wrap}
#bar b{font-size:15px}#bar small{color:var(--mu);flex:1;min-width:180px}
.seg{display:inline-flex;background:var(--mint);border-radius:99px;padding:4px}
.seg button{padding:7px 18px;border-radius:99px;font-weight:600;color:var(--mu)}
.seg button.on{background:var(--card);color:var(--pd);box-shadow:0 1px 4px var(--sh)}
.rs{padding:8px 14px;border:1px solid var(--ln);border-radius:99px;font-weight:600;color:var(--pd)}
#root{flex:1;min-height:0;position:relative}
#root.web{overflow:auto}
#root.app{display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.web .site{background:var(--bg);min-height:100%}
.nav{height:72px;background:var(--card);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:0;padding:0 32px;position:sticky;top:0;z-index:5}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:24px;letter-spacing:-.5px;color:var(--ink)}
.logo svg{color:var(--pd)}
.links{display:flex;gap:8px;margin:0 auto}
.links button{height:72px;padding:0 22px;font-weight:500;font-size:15px;color:var(--mu);border-bottom:3px solid transparent}
.links button.on{color:var(--p);font-weight:600;border-color:var(--p)}
.nr{display:flex;gap:10px;align-items:center}
.av{width:36px;height:36px;border-radius:50%;background:var(--p);color:#fff;display:grid;place-items:center;font-weight:700}
.btn{height:44px;padding:0 22px;border-radius:99px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent}
.b1{background:var(--p);color:#fff}.b2{background:var(--card);border-color:var(--ln);color:var(--pd)}.b3{background:var(--mint);color:var(--pd)}
.btn[disabled]{opacity:.5;cursor:default}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.chip{height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:var(--card);font-weight:500;font-size:13px}
.chip.on{background:var(--p);color:#fff;border-color:var(--p)}
.chip.sel.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px}
.ph{background-color:#c9d6d3;background-image:var(--im,none),var(--g);background-size:cover;background-position:center;background-repeat:no-repeat;position:relative;overflow:hidden}
.ph:after{content:var(--lb,'Ảnh minh họa');position:absolute;left:10px;bottom:8px;font-size:10px;color:#fff;opacity:.85;letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.55)}
.h1{font-size:60px;line-height:70px;font-weight:700;letter-spacing:-1px}
.hero{background:var(--mint);padding:48px 0}
.hg{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.sb{display:flex;align-items:center;background:var(--card);border-radius:99px;padding:8px 8px 8px 28px;box-shadow:0 8px 12px var(--sh);gap:8px}
.sb input{flex:1;border:0;outline:0;background:none;min-width:0;font-size:16px}
.hi{height:430px;border-radius:28px;position:relative}
.hi .fl{position:absolute;left:32px;bottom:-16px;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 8px 12px var(--sh);width:300px}
h2{font-size:22px;font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
.pc{overflow:hidden;box-shadow:0 8px 24px var(--sh);cursor:pointer}
.pc .ph{height:192px}.pb{padding:14px 15px 16px;display:flex;flex-direction:column;gap:8px}
.pb h3{font-size:18px;font-weight:600;line-height:24px;cursor:pointer}
.pb h3:hover{color:var(--p)}
.pb small{color:var(--mu);font-size:13px}
.pr{display:flex;justify-content:space-between;align-items:center}.pr b{color:var(--pd)}
.tg{position:absolute;left:11px;top:11px;background:var(--card);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:500;z-index:1}
.tg.ref{background:#fef3c7;color:#6b4a07}
.sv{position:absolute;right:11px;top:11px;background:var(--card);color:var(--p);border-radius:99px;padding:5px 14px;font-size:12px;font-weight:600;z-index:1;cursor:pointer}
.bd{border-radius:99px;padding:5px 10px;font-size:11px;font-weight:500;background:var(--off);color:var(--mu)}
.bd.g{background:var(--grb);color:var(--gr)}.bd.a{background:var(--amb);color:var(--am)}.bd.rd{background:var(--rdb);color:var(--rd)}
.rt{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:500;color:var(--ink)}
.st{color:var(--st);letter-spacing:1px}.st i{font-style:normal;color:var(--ln)}
.cta{background:var(--cta);border-radius:24px;padding:28px 40px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:20px}
.cta b{font-size:24px;display:block;margin-bottom:6px}.cta span{color:#cde9e6;font-size:15px}
.cta .b2{color:#0a5c5c;background:#fff}
.bc{font-size:12px;color:var(--mu);margin:20px 0 10px}
.dg{display:grid;grid-template-columns:1fr 380px;gap:32px;align-items:start}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal .ph:first-child{grid-column:1/3;height:360px}.gal .ph{height:120px;border-radius:20px}.gal .ph:first-child{border-radius:24px}
.side{padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 8px 24px var(--sh)}
.big{font-size:44px;font-weight:700;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.tile{padding:14px 18px}.tile small{display:block;color:var(--mu);font-size:11px;margin-bottom:4px}.tile b{font-size:14px}
.rv{padding:18px;margin-bottom:14px}
.rvh{display:flex;gap:12px;align-items:center}
.rvh .av{width:40px;height:40px}
.th{display:flex;gap:8px;margin:10px 0}.th .ph{width:62px;height:42px;border-radius:8px}.th .ph:after{display:none}
.map{position:relative;border-radius:24px;overflow:hidden;background:#dce9e6;min-height:200px}
.map .rd1,.map .rd2{position:absolute;background:#fff}
.map .pk{position:absolute;left:8%;top:14%;width:28%;height:30%;background:#cfe6d0;border-radius:10px}
.map .wt{position:absolute;right:-12%;bottom:-18%;width:55%;height:55%;background:#b9dde8;border-radius:50%}
.pin{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;background:var(--p);border:2px solid #fff;cursor:pointer;transition:.15s}
.pin.on{background:var(--st);width:26px;height:26px}
.pin.lb{width:auto;height:auto;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:600;background:#fff;color:var(--pd);border:1.5px solid var(--p)}
.pin.lb.on{background:var(--pd);color:#fff;border-color:var(--pd)}
.pop{position:absolute;left:20px;bottom:20px;background:var(--card);border-radius:16px;padding:10px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 20px var(--sh);cursor:pointer;max-width:290px}
.pop .ph{width:58px;height:58px;border-radius:10px}.pop .ph:after{display:none}
.sw{width:50px;height:30px;border-radius:99px;background:var(--ln);position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--p)}.sw.on:after{left:23px}
.tgl{display:flex;align-items:center;gap:10px;cursor:pointer}
.sl{display:grid;grid-template-columns:300px 1fr 1fr 1fr;gap:24px;align-items:start}
.col{background:var(--mint);border-radius:20px;padding:16px;min-height:200px}
.col.ov{outline:2px dashed var(--p)}
.col h4{font-size:18px}.col small{color:var(--mu);font-size:12px}
.ti{background:var(--card);border-radius:16px;padding:10px;display:flex;gap:12px;margin-top:12px;position:relative;box-shadow:0 2px 8px var(--sh)}
.ti .ph{width:64px;height:64px;border-radius:10px;flex:none}.ti .ph:after{display:none}
.ti b{display:block;font-size:13px}.ti em{font-style:normal;color:var(--pd);font-weight:600;font-size:13px}.ti small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.ti[draggable=true]{cursor:grab}
.x{position:absolute;right:8px;top:6px;color:var(--mu);font-size:16px}
.mv{color:var(--mu);padding:6px}
.drop{border:1.5px dashed var(--p);border-radius:14px;padding:18px;text-align:center;color:var(--pd);margin-top:12px;width:100%;font-size:13px}
.sum{display:flex;gap:80px;padding:22px 30px;margin-top:24px;box-shadow:0 8px 24px var(--sh)}
.sum small{display:block;color:var(--mu);font-size:12px}.sum b{font-size:26px}
.pf{padding:28px;display:flex;gap:28px;align-items:center}
.pf .av{width:112px;height:112px;font-size:44px}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%;background:var(--pd)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:16px 0}
.stat{padding:18px 20px}.stat b{font-size:32px;color:var(--pd);display:block}.stat small{color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dc{padding:24px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:16px;text-align:center;font-size:11px}
.stamp{width:66px;height:66px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;background:#fef3c7;border:2px solid var(--st);color:var(--st);font-size:22px}
.stamp.lk{background:var(--off);border-color:var(--ln);color:var(--mu)}
.dchip{padding:10px 18px;border-radius:99px;background:var(--off);color:var(--mu);font-size:13px;font-weight:500}.dchip.on{background:var(--p);color:#fff}
.rl{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;margin-bottom:10px}
.rl small{color:var(--mu);display:block;margin-top:3px}
.rw{max-width:720px;margin:40px auto;padding:32px}
.steps{display:flex;gap:10px;margin:18px 0 8px}.steps i{flex:1;height:4px;border-radius:9px;background:var(--ln)}.steps i.on{background:var(--p)}
.drz{border:1.5px dashed var(--p);background:var(--mint);border-radius:24px;padding:36px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;margin:18px 0}
.drz p{color:var(--mu);font-size:13px}
.msg{background:var(--grb);color:var(--gr);border-radius:16px;padding:16px;font-weight:600;display:flex;gap:12px;align-items:center;margin:16px 0}
.msg small{display:block;font-weight:400;margin-top:2px}
.fld{width:100%;border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:14px 16px;outline:0}
.fld:focus{border-color:var(--p)}
.cr{background:var(--bg);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.stars button{font-size:26px;color:var(--ln);padding:0 4px}.stars button.on{color:var(--st)}
.fo{display:flex;justify-content:space-between;align-items:center;margin-top:26px;gap:12px}
.ov{position:fixed;inset:0;background:rgba(10,30,32,.5);display:grid;place-items:center;z-index:30;padding:16px}
.md{background:var(--card);border-radius:28px;padding:32px;width:480px;max-width:100%;position:relative;max-height:90%;overflow:auto}
.md h3{font-size:26px;margin-bottom:14px}.md p{color:var(--mu);line-height:1.5}
.mx{position:absolute;right:20px;top:20px;color:var(--mu)}
.dv{display:flex;align-items:center;gap:10px;color:var(--mu);font-size:13px;margin:18px 0}.dv:before,.dv:after{content:"";flex:1;height:1px;background:var(--ln)}
.err{color:var(--rd);font-size:12px;margin-top:6px}
.dr{background:var(--grb);color:var(--gr);border-radius:16px;padding:14px 16px;display:flex;gap:12px;margin:18px 0}
.dr small{display:block;font-weight:400;margin-top:2px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--card);padding:10px 20px;border-radius:99px;font-weight:500;opacity:0;pointer-events:none;transition:.25s;z-index:60}
#toast.on{opacity:1;transform:translateX(-50%)}
/* app */
/* iPhone 18 Pro Max: màn hình 440 x 956 pt (1320 x 2868 px @3x), thân máy thêm viền 12 pt */
.pw{flex:none;position:relative}
.device{position:absolute;left:0;top:0;width:464px;height:980px;padding:12px;background:#101c1e;border-radius:70px;box-shadow:0 20px 50px var(--sh),inset 0 0 0 2px #2c3d3f;transform-origin:0 0}
.phone{width:440px;height:956px;background:var(--bg);border-radius:58px;display:flex;flex-direction:column;overflow:hidden;position:relative}
.phone:before{content:"";position:absolute;top:11px;left:50%;width:126px;height:37px;margin-left:-63px;background:#000;border-radius:99px;z-index:60;pointer-events:none}
.phone:after{content:"";position:absolute;bottom:8px;left:50%;width:140px;height:5px;margin-left:-70px;background:var(--ink);opacity:.85;border-radius:99px;z-index:60;pointer-events:none}
.sbr{height:54px;padding:8px 38px 0 44px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:16px;flex:none;background:var(--bg)}
.sbr i{display:flex;gap:6px;align-items:center;font-style:normal}
.scr{flex:1;overflow:auto;position:relative}
.pad{padding:0 20px}
.tabs{display:flex;background:var(--card);border-top:1px solid var(--ln);padding:8px 8px 30px;flex:none}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);padding:6px 0;border-radius:99px;margin:0 4px}
.tabs button.on{color:var(--pd);font-weight:600}.tabs button.on span{background:var(--mint);border-radius:99px;padding:4px 18px}.tabs span{padding:4px 18px;display:block}
.atop{display:flex;align-items:center;gap:14px;padding:10px 20px;height:56px;font-weight:600;font-size:16px}
.atop .r{margin-left:auto;color:var(--p);font-size:14px;font-weight:600}
.atop svg{color:var(--p)}
.app .h1{font-size:32px;line-height:40px;letter-spacing:-.5px}
.ahero{background:var(--mint);padding:16px 20px 20px}
.kick{font-size:11px;letter-spacing:.8px;color:var(--pd);font-weight:500;margin:14px 0 6px}
.app .sb{padding:6px 16px;height:54px;box-shadow:none;border:1px solid var(--ln)}
.app .cta{flex-direction:column;align-items:stretch;padding:22px;border-radius:24px}
.app .cta b{font-size:22px}.app .cta .btn{width:100%}
.big1 .ph{height:190px}
.row{display:flex;gap:12px;padding:10px;margin-top:14px;align-items:stretch}
.row .ph{width:86px;min-height:104px;border-radius:12px;flex:none}.row .ph:after{display:none}
.row .pb{padding:0;flex:1;gap:6px}.row .pb h3{font-size:15px;line-height:20px}
.row .sv{position:static;padding:0;background:none}
.sel1{border:2px solid var(--p)}
.fix{flex:none;background:var(--card);border-top:1px solid var(--ln);padding:12px 20px 30px;display:flex;gap:12px;align-items:center}
.fix .btn{flex:1;height:52px}.fix small{display:block;text-align:center;color:var(--mu);font-size:11px;margin-top:8px}
.app .dg,.app .tiles,.app .two,.app .stats,.app .sl{display:block}
.app .stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.app .stat b{font-size:28px}
.app .col{margin-bottom:14px}
.sheet{position:absolute;inset:0;background:rgba(10,30,32,.5);z-index:20;display:flex;align-items:flex-end}
.sheet .md{border-radius:28px 28px 0 0;width:100%;padding:24px 20px 44px}
.pickb{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px;border-radius:14px;border:1px solid var(--ln);margin-top:10px}
.pickb .ph{width:48px;height:48px;border-radius:8px}.pickb .ph:after{display:none}
.ai{background:var(--mint);color:var(--pd);border-radius:16px;padding:14px;display:flex;gap:10px;font-size:13px;margin:16px 20px}
.acc{width:100%;display:flex;justify-content:space-between;align-items:center;text-align:left;padding:14px 16px}
@media (max-width:900px){.web .grid4{grid-template-columns:1fr 1fr}.web .hg,.web .dg,.web .two{grid-template-columns:1fr}.web .sl{grid-template-columns:1fr 1fr}.web .links{display:none}.web .h1{font-size:40px;line-height:48px}.web .hi{height:260px}.web .stats{grid-template-columns:1fr 1fr}.web .tiles{grid-template-columns:1fr}.web .sp{grid-template-columns:1fr!important}.nav{padding:0 16px}}
@media (max-width:480px){#root.app{padding:0;align-items:stretch}.pw{width:100%!important;height:100%!important}.device{position:static;width:100%;height:100%;padding:0;border-radius:0;transform:none!important;box-shadow:none}.phone{width:100%;height:100%;border-radius:0}.phone:before,.phone:after{display:none}.sbr{padding:8px 20px 0}}
</style>
</head>
<body>
<div id="bar">
  <b>🧳 Dạo · Demo tương tác</b>
  <small>Luồng gợi ý: Khám phá → Chi tiết → Viết đánh giá → Đăng nhập → Hộ chiếu</small>
  <div class="seg"><button data-a="mode:web" id="mw">Web</button><button data-a="mode:app" id="ma">App</button></div>
  <span id="dev" style="color:var(--mu);font-size:12px"></span>
  <button class="rs" data-a="reset">Làm lại từ đầu</button>
</div>
<div id="root"></div>
<div id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const pr=n=>n===0?'Miễn phí':'~'+fm(n)+'đ';
const IC={
compass:'<circle cx="12" cy="12" r="10"/><path d="m16 8-2 6-6 2 2-6z"/>',
map:'<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>',
route:'<circle cx="6" cy="19" r="3"/><path d="M9 19h8.5a3.5 3.5 0 0 0 0-7h-11a3.5 3.5 0 0 1 0-7H15"/><circle cx="18" cy="5" r="3"/>',
user:'<rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="12" cy="10" r="3"/><path d="M7 20c1-3 3-4 5-4s4 1 5 4"/>',

 addtrip(id){if(!S.saved.includes(id))S.saved.push(id);S.modal={t:'pick',pid:id};render()},
 dist(d){S.dist=S.dist===d?null:d;render()},chip(_,__,t){t.classList.toggle('on')},

 dosearch(){S.q=$('#sq').value;render();toast('Đã cập nhật kết quả')},
 schip(k){S.chips[k]=S.chips[k]?0:1;render()},ver(){S.verified=!S.verified;render()},view(v){S.view=v;render()},sel(id,_,t,e){S.sel=id;render()},
 off(){S.off=!S.off;render()},tab(v){S.tab=v;render()},rm(id,_,t,e){e.stopPropagation();SL.forEach(s=>S.plan[s[0]]=S.plan[s[0]].filter(x=>x!==id));render()},

 pick(slot){S.modal={t:'pick',slot};render()},slot(id){S.modal={t:'pick',pid:id};render()},
 put(id,slot){move(id,slot);S.modal=null;render();toast('Đã thêm vào lịch trình')},
 write(id){S.pid=id;S.R.step=1;S.prev=S.screen==='detail'?'detail':S.screen;S.back2=S.screen;S.screen='review';render();$('#root').scrollTop=0;if($('.scr'))$('.scr').scrollTop=0},
 exit(){S.screen=S.back2||'home';render();toast('Đã lưu bản nháp đánh giá')},
 addph(){S.R.photos=Math.min(6,S.R.photos+1);render()},rmph(){S.R.photos=Math.max(0,S.R.photos-1);render()},rcpt(){S.R.receipt=!S.R.receipt;render()},
 star(k,i){S.R.rate[k]=+i;render()},
 tip(t){const a=S.R.tips,i=a.indexOf(t);i>-1?a.splice(i,1):a.push(t);render()},note(t){const a=S.R.notes,i=a.indexOf(t);i>-1?a.splice(i,1):a.push(t);render()},
 mic(){S.R.text=(S.R.text?S.R.text+' ':'')+'Nên đến buổi sáng, ít người và ánh sáng đẹp.';S.err=0;render()},
 next(){syncInputs();S.R.step++;render();if($('.scr'))$('.scr').scrollTop=0},prev(){syncInputs();S.R.step--;render()},
 submit(){syncInputs();if(S.R.text.trim().length<5){S.err=1;render();return}S.err=0;needLogin(finishReview)},
 login(m){if(m==='e'){const v=($('#em')||{}).value||'';S.email=v;if(!/.+@.+\..+/.test(v)){S.emErr=1;render();return}}S.emErr=0;S.user=true;S.modal=null;const f=S.after;S.after=null;toast('Đăng nhập thành công · bản nháp được giữ nguyên');f?f():(S.screen=S.prev2||'home');render()},
 toast(t){toast(t)}

/* ---------- ẢNH THẬT CỦA ĐỊA ĐIỂM ----------
   Cách hoạt động: khi mở trang, tự tìm ảnh trên Wikipedia / Wikimedia Commons cho từng địa điểm,
   thử tải trước, ảnh nào tải được mới dùng. Nếu offline hoặc không tìm thấy thì giữ nền gradient.
   Muốn dùng ảnh của riêng bạn (ảnh từ Figma, ảnh chụp…): dán link vào IMG bên dưới, tối đa 3 ảnh mỗi địa điểm.
   Ví dụ: IMG.po=['https://…/buu-dien-1.jpg','https://…/buu-dien-2.jpg'] */
const IMG={po:[],vk:[],tt:[],c42:[],db:[],bt:[]};
const SRC={
 po:{w:'Saigon_Central_Post_Office',q:['Saigon Central Post Office','Bưu điện Trung tâm Sài Gòn']},
 db:{w:'Notre-Dame_Cathedral_Basilica_of_Saigon',q:['Saigon Notre-Dame Basilica','Nhà thờ Đức Bà Sài Gòn']},
 bt:{w:'Bến_Thành_Market',q:['Ben Thanh Market Ho Chi Minh City','Chợ Bến Thành']},
 vk:{q:['Vinh Khanh food street District 4','Phố ẩm thực Vĩnh Khánh','Saigon street food seafood night']},
 tt:{q:['Thu Thiem riverside park Ho Chi Minh City','Thủ Thiêm bờ sông Sài Gòn','Saigon River Thu Thiem promenade']},
 c42:{q:['42 Nguyen Hue apartment building cafe','Nguyễn Huệ chung cư cà phê','Nguyen Hue apartment Saigon coffee']}
};
const jget=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(r.status);return r.json()};
const fname=u=>{try{return decodeURIComponent(u.split('/').pop()||'').replace(/^\d+px-/,'').toLowerCase()}catch(e){return u}};
const probe=u=>new Promise(r=>{const i=new Image();i.onload=()=>r(u);i.onerror=()=>r(null);i.src=u});
async function wikiLead(t){const j=await jget('https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(t));const s=j.thumbnail&&j.thumbnail.source;return s?[s.replace(/\/\d+px-/,'/960px-')]:[]}
async function commonsSearch(q){
 const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=15&gsrsearch='+encodeURIComponent(q+' filetype:bitmap')+'&prop=imageinfo&iiprop=url|size|mime&iiurlwidth=960';
 const j=await jget(u);
 return Object.values((j.query||{}).pages||{}).sort((a,b)=>a.index-b.index).map(p=>(p.imageinfo||[])[0]).filter(i=>i&&/jpeg/.test(i.mime)&&i.width>=1000&&i.width>=i.height*1.1).map(i=>i.thumburl||i.url)}
async function loadPlace(id){
 const c=SRC[id],own=IMG[id]&&IMG[id].length;let cand=own?IMG[id].slice():[];
 if(!own){
  try{if(c.w)cand=cand.concat(await wikiLead(c.w))}catch(e){}
  for(const q of c.q){if(cand.length>=6)break;try{cand=cand.concat(await commonsSearch(q))}catch(e){}}
 }
 const seen=new Set();cand=cand.filter(u=>{const k=fname(u);if(seen.has(k))return false;seen.add(k);return true}).slice(0,8);
 const ok=(await Promise.all(cand.map(probe))).filter(Boolean).slice(0,3);
 if(!ok.length)return;
 const rt=document.documentElement.style,lb=own?"'Ảnh địa điểm'":"'Ảnh: Wikimedia Commons'";
 for(let k=0;k<3;k++){
  rt.setProperty(`--im-${id}-${k}`,`linear-gradient(180deg,rgba(0,0,0,0) 55%,rgba(0,0,0,.4) 100%),url("${ok[k%ok.length]}")`);
  rt.setProperty(`--lb-${id}-${k}`,lb)}
}
Object.keys(SRC).forEach(id=>loadPlace(id));
render();
</script>
